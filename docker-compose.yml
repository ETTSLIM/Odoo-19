services:
  web:
    image: odoo:19.0
    container_name: odoo19_garage
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./odoo_data:/var/lib/odoo
    command: --dev=reload,xml,qweb
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: odoo19_garage_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./db_data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

networks:
  default:
    name: odoo-garage-net
